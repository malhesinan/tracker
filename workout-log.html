<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E3B43">
<title>Workout Log</title>
<style>
:root{
  --petrol:#0E3B43; --deep:#0A2E35; --mid:#1C5C66; --lt:#4F949C;
  --amber:#E0A526; --amberdp:#9E7208;
  --ink:#161A19; --slate:#5F6A6D; --paper:#FAFAF8; --card:#FFFFFF;
  --wash:#EDF2F1; --rule:#DDE4E2;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--wash); color:var(--ink);
  font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:4px}

/* ── top bar ───────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:40;background:var(--petrol);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
}
.tr{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.brand{flex:1;min-width:0}
.b1{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--lt);font-family:var(--mono)}
.b2{font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.15;margin-top:1px}
.wk{display:flex;align-items:center;gap:2px;background:var(--deep);border-radius:10px;padding:3px}
.wk button{width:32px;height:32px;color:var(--lt);font-size:19px;line-height:1;border-radius:7px}
.wk button:active{background:#123f47}
.wk button[disabled]{opacity:.28}
.wkn{min-width:60px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--paper)}
.wkn small{display:block;font-size:8.5px;letter-spacing:.14em;color:var(--lt);font-weight:400}

/* ── day tabs ──────────────────────────────────── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 14px;border-radius:9px;background:var(--deep);
  color:#7FB3B9;font-size:13.5px;font-weight:600;white-space:nowrap;position:relative;
}
.tab .td{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;opacity:.75;font-weight:400;margin-top:1px}
.tab.on{background:var(--paper);color:var(--petrol)}
.tab .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--amber);display:none}
.tab.done .dot{display:block}
.tab.on.done .dot{background:var(--amberdp)}

/* ── session header ────────────────────────────── */
.shead{background:var(--paper);padding:14px 14px 12px;border-bottom:1px solid var(--rule)}
.sh1{font-weight:700;font-size:23px;letter-spacing:-.02em;color:var(--petrol);line-height:1.1}
.sh2{font-size:13.5px;color:var(--slate);margin-top:3px}
.bar{height:5px;background:var(--rule);border-radius:3px;margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);width:0;border-radius:3px;
  transition:width .3s ease}
.brow{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px}
.bl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--slate);text-transform:uppercase}
.bv{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--petrol)}

/* ── coach note ────────────────────────────────── */
.coach{margin:12px 14px 0;background:var(--petrol);color:#DCE9EA;border-radius:12px;
  padding:12px 14px;font-size:13.5px;line-height:1.5}
.coach b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);margin-bottom:5px;font-weight:600}

/* ── exercise card ─────────────────────────────── */
.wrap{padding:12px 14px 26px}
.ex{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(14,59,67,.07)}
.exh{display:flex;align-items:center;gap:11px;padding:12px 13px}
.pic{flex:0 0 52px;height:36px}
.pic svg{width:52px;height:36px;display:block}
.exi{flex:1;min-width:0}
.exn{font-weight:600;font-size:15.5px;color:var(--petrol);line-height:1.2}
.exp{font-family:var(--mono);font-size:11.5px;color:var(--amberdp);margin-top:3px;font-weight:600}
.chev{flex:0 0 26px;text-align:right;color:var(--rule);font-size:13px;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg);color:var(--lt)}
.exb{display:none;padding:0 13px 13px}
.ex.open .exb{display:block}
.cue{font-size:13px;color:var(--slate);line-height:1.45;padding:0 0 11px;
  border-top:1px solid var(--wash);padding-top:10px}

/* ── set rows ──────────────────────────────────── */
.set{display:flex;align-items:center;gap:8px;padding:5px 0}
.sn{flex:0 0 26px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--slate)}
.fld{flex:1;position:relative}
.fld input{
  width:100%;height:46px;border:1.5px solid var(--rule);border-radius:10px;
  background:var(--paper);padding:14px 8px 3px;font-family:var(--mono);
  font-size:17px;font-weight:600;text-align:center;color:var(--ink);
}
.fld input::placeholder{color:#BFC9C7;font-weight:400}
.fld input:focus{border-color:var(--mid);background:#fff;outline:none}
.fld label{position:absolute;top:4px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--slate);
  text-transform:uppercase;pointer-events:none}
.set.filled .fld input{border-color:var(--mid);background:#fff}
.tick{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.set.filled .tick{background:var(--amber);border-color:var(--amber);color:#4A3405}
.prev{font-family:var(--mono);font-size:10.5px;color:var(--slate);
  padding:2px 0 8px 34px;letter-spacing:.03em}
.prev span{color:var(--amberdp);font-weight:600}

/* ── per-exercise note ─────────────────────────── */
.note textarea{
  width:100%;min-height:44px;border:1.5px solid var(--rule);border-radius:10px;
  background:var(--paper);padding:9px 11px;font-size:14px;resize:vertical;line-height:1.4;
}
.note textarea:focus{border-color:var(--mid);background:#fff;outline:none}
.nlab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:9px 0 5px}

/* ── rest timer ────────────────────────────────── */
.rest{display:flex;align-items:center;gap:9px;margin-top:10px}
.rest button{
  flex:1;height:42px;border-radius:10px;background:var(--wash);color:var(--petrol);
  font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.rest button:active{background:var(--rule)}
.rest button.run{background:var(--petrol);color:var(--amber)}

/* ── session note ──────────────────────────────── */
.snote{background:var(--card);border-radius:14px;padding:13px;box-shadow:0 1px 2px rgba(14,59,67,.07)}
.snote h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--petrol)}
.snote textarea{width:100%;min-height:76px;border:1.5px solid var(--rule);border-radius:10px;
  background:var(--paper);padding:10px 11px;font-size:14px;resize:vertical;line-height:1.45}
.snote textarea:focus{border-color:var(--mid);background:#fff;outline:none}

/* ── history ───────────────────────────────────── */
.hist{background:var(--card);border-radius:14px;padding:13px;margin-top:12px;
  box-shadow:0 1px 2px rgba(14,59,67,.07)}
.hist h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--petrol)}
.hist p{margin:0 0 10px;font-size:12.5px;color:var(--slate)}
.hrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--wash);
  font-size:13.5px}
.hrow b{flex:1;font-weight:600;color:var(--petrol);font-size:13.5px}
.hv{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.hd{font-family:var(--mono);font-size:10.5px;color:var(--slate);flex:0 0 44px;text-align:right}
.up{color:#1E7A3E}.down{color:#A8323C}

/* ── toast + status ────────────────────────────── */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(80px);
  bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--petrol);color:var(--paper);
  padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:500;z-index:90;
  opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;
  box-shadow:0 4px 16px rgba(10,46,53,.28)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.err{background:#8C2B33}

.empty{text-align:center;padding:26px 16px;color:var(--slate);font-size:13.5px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--rule);
  border-top-color:var(--mid);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="tr">
    <div class="brand">
      <div class="b1">Gym Programme</div>
      <div class="b2">Workout Log</div>
    </div>
    <div class="wk">
      <button id="wkDown" aria-label="Previous week">−</button>
      <div class="wkn"><span id="wkNum">1</span><small>WEEK</small></div>
      <button id="wkUp" aria-label="Next week">+</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="shead">
  <div class="sh1" id="shTitle">—</div>
  <div class="sh2" id="shSub"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="brow"><span class="bl" id="barLab">Sets logged</span><span class="bv" id="barVal">0 / 0</span></div>
</div>

<div class="coach" id="coach"><b>Before you start</b><span id="coachTxt"></span></div>

<div class="wrap">
  <div id="list"><div class="empty"><span class="spin"></span>Loading your log…</div></div>
  <div class="snote">
    <h3>How did the session go?</h3>
    <textarea id="sessNote" placeholder="Energy, aches, anything you want to remember next week…"></textarea>
  </div>
  <div class="hist" id="hist"></div>
</div>

<div class="toast" id="toast"></div>

const DAYS = DATA.days, GLYPHS = DATA.glyphs;
const MAXWK = 12;

let week = 1, dayIx = 0;
let log = {};      // { exIndex: { sets:[{kg,reps}], note:"" } , _note:"" }
let prev = {};     // previous week's log for this day
let saveTimer = null, restTimer = null, restLeft = 0, restEl = null;

const $ = id => document.getElementById(id);
const key = (w,d) => `log:w${w}:${d}`;

function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className = 'toast'; }, 2200);
}

/* ── storage ─────────────────────────────────── */
async function load(w,d){
  try{
    const r = await window.storage.get(key(w,d));
    return r && r.value ? JSON.parse(r.value) : {};
  }catch(e){ return {}; }
}
async function save(){
  try{
    await window.storage.set(key(week, DAYS[dayIx].id), JSON.stringify(log));
  }catch(e){
    toast('Could not save — try again', true);
  }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 600);
}

/* ── rest timer ──────────────────────────────── */
function stopRest(){
  clearInterval(restTimer); restTimer = null;
  if(restEl){ restEl.classList.remove('run'); restEl.textContent = restEl.dataset.label; restEl = null; }
}
function startRest(btn, secs){
  if(restEl === btn){ stopRest(); return; }
  stopRest();
  restEl = btn; restLeft = secs; btn.classList.add('run');
  const tick = ()=>{
    const m = Math.floor(restLeft/60), s = restLeft%60;
    btn.textContent = `${m}:${String(s).padStart(2,'0')}  rest`;
    if(restLeft <= 0){
      stopRest();
      toast('Rest done — next set');
      if(navigator.vibrate) navigator.vibrate([180,90,180]);
      return;
    }
    restLeft--;
  };
  tick();
  restTimer = setInterval(tick, 1000);
}

/* ── rendering ───────────────────────────────── */
function renderTabs(){
  $('tabs').innerHTML = DAYS.map((d,i)=>
    `<button class="tab${i===dayIx?' on':''}" data-i="${i}">
       ${d.tab}<span class="td">${d.day.slice(0,3)}</span><span class="dot"></span>
     </button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ stopRest(); dayIx = +b.dataset.i; refresh(); };
  });
}

function setCount(){
  const d = DAYS[dayIx];
  let done = 0, total = 0;
  d.ex.forEach((e,i)=>{
    total += e[3];
    const s = (log[i] && log[i].sets) || [];
    for(let k=0;k<e[3];k++) if(s[k] && s[k].kg !== '' && s[k].kg != null) done++;
  });
  return {done,total};
}

function updateBar(){
  const {done,total} = setCount();
  $('barFill').style.width = total ? (done/total*100)+'%' : '0%';
  $('barVal').textContent = `${done} / ${total}`;
  const tab = $('tabs').querySelector(`.tab[data-i="${dayIx}"]`);
  if(tab) tab.classList.toggle('done', done > 0);
}

function prevText(i, k){
  const p = prev[i] && prev[i].sets && prev[i].sets[k];
  if(!p || p.kg === '' || p.kg == null) return '';
  return `Week ${week-1}: <span>${p.kg} kg × ${p.reps || '–'}</span>`;
}

function render(){
  const d = DAYS[dayIx];
  $('shTitle').textContent = d.tab;
  $('shSub').textContent = `${d.day} · ${d.sub} · ${d.mins} min`;
  $('coachTxt').textContent = d.notes;
  $('sessNote').value = log._note || '';

  $('list').innerHTML = d.ex.map((e,i)=>{
    const [g,name,pres,nsets,rest,cue] = e;
    const ld = log[i] || {sets:[],note:''};
    const rows = [];
    for(let k=0;k<nsets;k++){
      const s = (ld.sets && ld.sets[k]) || {kg:'',reps:''};
      const filled = s.kg !== '' && s.kg != null;
      const pv = prevText(i,k);
      const unit = rest === 0 ? 'MIN' : 'KG';
      const second = rest === 0 ? 'NOTE' : 'REPS';
      rows.push(`
        <div class="set${filled?' filled':''}" data-ex="${i}" data-set="${k}">
          <div class="sn">${nsets>1 ? k+1 : '·'}</div>
          <div class="fld"><label>${unit}</label>
            <input type="text" inputmode="decimal" value="${s.kg||''}" data-f="kg" placeholder="—"></div>
          <div class="fld"><label>${second}</label>
            <input type="text" inputmode="numeric" value="${s.reps||''}" data-f="reps" placeholder="—"></div>
          <div class="tick">✓</div>
        </div>
        ${pv ? `<div class="prev">${pv}</div>` : ''}`);
    }
    return `<div class="ex" data-ex="${i}">
      <div class="exh">
        <div class="pic">${GLYPHS[g]||''}</div>
        <div class="exi"><div class="exn">${name}</div><div class="exp">${pres}</div></div>
        <div class="chev">▶</div>
      </div>
      <div class="exb">
        <div class="cue">${cue}</div>
        ${rows.join('')}
        ${rest ? `<div class="rest"><button data-rest="${rest}" data-label="Start ${rest}s rest">Start ${rest}s rest</button></div>` : ''}
        <div class="note">
          <div class="nlab">Note for this exercise</div>
          <textarea data-note="${i}" placeholder="Felt heavy, left shoulder tight, machine taken…">${ld.note||''}</textarea>
        </div>
      </div>
    </div>`;
  }).join('');

  wire();
  updateBar();
  renderHist();
}

function wire(){
  document.querySelectorAll('.exh').forEach(h=>{
    h.onclick = ()=> h.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('.set input').forEach(inp=>{
    inp.oninput = ()=>{
      const row = inp.closest('.set');
      const i = +row.dataset.ex, k = +row.dataset.set, f = inp.dataset.f;
      log[i] = log[i] || {sets:[],note:''};
      log[i].sets = log[i].sets || [];
      log[i].sets[k] = log[i].sets[k] || {kg:'',reps:''};
      log[i].sets[k][f] = inp.value.trim();
      row.classList.toggle('filled', !!log[i].sets[k].kg);
      updateBar();
      queueSave();
    };
    inp.onfocus = ()=> setTimeout(()=> inp.select(), 40);
  });
  document.querySelectorAll('[data-note]').forEach(t=>{
    t.oninput = ()=>{
      const i = +t.dataset.note;
      log[i] = log[i] || {sets:[],note:''};
      log[i].note = t.value;
      queueSave();
    };
  });
  document.querySelectorAll('[data-rest]').forEach(b=>{
    b.onclick = ()=> startRest(b, +b.dataset.rest);
  });
}

function renderHist(){
  const d = DAYS[dayIx];
  const rows = d.ex.map((e,i)=>{
    const cur = best(log[i]), pv = best(prev[i]);
    if(cur == null && pv == null) return '';
    let delta = '', cls = '';
    if(cur != null && pv != null){
      const diff = +(cur - pv).toFixed(1);
      if(diff > 0){ delta = '+'+diff; cls='up'; }
      else if(diff < 0){ delta = String(diff); cls='down'; }
      else delta = '=';
    }
    return `<div class="hrow"><b>${e[1]}</b>
      <span class="hv">${cur != null ? cur+' kg' : '—'}</span>
      <span class="hd ${cls}">${delta}</span></div>`;
  }).filter(Boolean).join('');

  $('hist').innerHTML = rows
    ? `<h3>Top set vs last week</h3><p>Your heaviest logged set for each exercise, compared with week ${week-1}.</p>${rows}`
    : `<h3>Top set vs last week</h3><p>Log a few sets and your comparison against the previous week appears here.</p>`;
}
function best(entry){
  if(!entry || !entry.sets) return null;
  const nums = entry.sets.filter(s=>s && s.kg).map(s=>parseFloat(s.kg)).filter(n=>!isNaN(n));
  return nums.length ? Math.max(...nums) : null;
}

/* ── refresh ─────────────────────────────────── */
async function refresh(){
  renderTabs();
  $('list').innerHTML = `<div class="empty"><span class="spin"></span>Loading…</div>`;
  const d = DAYS[dayIx];
  [log, prev] = await Promise.all([ load(week, d.id), week > 1 ? load(week-1, d.id) : Promise.resolve({}) ]);
  $('wkNum').textContent = week;
  $('wkDown').disabled = week <= 1;
  $('wkUp').disabled = week >= MAXWK;
  render();
  markDoneTabs();
}

async function markDoneTabs(){
  for(let i=0;i<DAYS.length;i++){
    if(i === dayIx) continue;
    const l = await load(week, DAYS[i].id);
    const any = Object.keys(l).some(k=> k !== '_note' && l[k].sets && l[k].sets.some(s=>s && s.kg));
    const tab = $('tabs').querySelector(`.tab[data-i="${i}"]`);
    if(tab) tab.classList.toggle('done', any);
  }
}

/* ── events ──────────────────────────────────── */
$('sessNote').oninput = e => { log._note = e.target.value; queueSave(); };
$('wkUp').onclick = ()=>{ if(week < MAXWK){ stopRest(); week++; refresh(); } };
$('wkDown').onclick = ()=>{ if(week > 1){ stopRest(); week--; refresh(); } };
window.addEventListener('beforeunload', ()=>{ clearTimeout(saveTimer); save(); });

/* ── start: resume the most recent week ──────── */
(async function init(){
  try{
    const r = await window.storage.list('log:');
    if(r && r.keys && r.keys.length){
      const weeks = r.keys.map(k=>{
        const m = /^log:w(\d+):/.exec(typeof k === 'string' ? k : (k.key||''));
        return m ? +m[1] : 0;
      });
      const mx = Math.max(...weeks, 1);
      if(mx >= 1 && mx <= MAXWK) week = mx;
    }
  }catch(e){ /* first run — week 1 is correct */ }
  const jsDay = new Date().getDay();          // 0 Sun … 4 Thu
  if(jsDay >= 0 && jsDay <= 4) dayIx = jsDay;
  await refresh();
})();
</script>
